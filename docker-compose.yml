services:
  scraper-engine:
    build:
      context: ./scraper-engine
      dockerfile: Dockerfile
    container_name: catalyst_scraper_engine
    environment:
      - DATABASE_URL=postgresql://diya-catalyst:Abid090300@host.docker.internal:5432/catalystDB
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8000"
    restart: unless-stopped

  catalyst-scout:
    build:
      context: ./catalyst-scout
      dockerfile: Dockerfile
    container_name: catalyst_scout
    env_file:
      - ./catalyst-scout/.env
    environment:
      - DATABASE_URL=postgresql://diya-catalyst:Abid090300@host.docker.internal:5432/catalystDB
      - SCRAPER_API_URL=http://scraper-engine:8000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - scraper-engine
    ports:
      - "3001:3000"
    restart: unless-stopped
